name: VISTA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DEMO_MODE: "true"
  PYTHONPATH: src/vista

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Import Verification (all 19 modules importable)
  # ═══════════════════════════════════════════════════════════════
  import-check:
    name: Module Import Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml loguru requests python-dotenv flask flask-socketio

      - name: Verify all module imports
        working-directory: src/vista
        run: |
          python -c "
          import os; os.environ['DEMO_MODE'] = 'true'
          from hal import OBDReader, IMUReader, AudioCapture, CameraCapture, GPIOManager, PowerManager
          from intelligence import VelocityEKF, CrashDetector, CrashEvidence, AudioClassifier, DecisionEngine, CloudVision
          from intelligence.theft_detector import TheftDetector
          from intelligence.predictive_analytics import PredictiveAnalyticsEngine
          from intelligence.health_monitor import SystemHealthMonitor
          from communication import AlertManager, TelegramAlertBot, Decision
          from data import SQLiteManager
          print('✅ All modules import successfully')
          "

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Unit Tests (20/20 must pass)
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: import-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml loguru requests python-dotenv flask flask-socketio

      - name: Run V3 Quick Tests
        working-directory: src/vista
        run: |
          python tests/test_v3_quick.py

  # ═══════════════════════════════════════════════════════════════
  # Job 3: SITL Demo (exit code 0 required)
  # ═══════════════════════════════════════════════════════════════
  sitl-demo:
    name: SITL Demo Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run on main branch (uses API keys from secrets)
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml loguru requests python-dotenv flask flask-socketio

      - name: Run SITL Demo
        working-directory: src/vista
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ../../scripts/demo_billion_dollar_architecture.py

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Code Quality
  # ═══════════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint check
        run: ruff check src/vista/ --select E,F,W --ignore E501,E402,F401 --exit-zero
